name: Scope detection

# SANDBOX-SPEC §5.7 — "Scope is detected from the diff, not from judgment." M7's own
# "done when" list asks for this to happen AUTOMATICALLY, which is the whole point: the
# font-family change and the Fluent icon migration both came out of one component's work
# and silently invalidated everything already verified. A rule that only runs when someone
# remembers to run it would have caught neither.
#
# This job now BLOCKS a system-wide change that names no system change. It reported and
# never blocked from M7 until this commit, and said why: steps 3 and 5 did not exist, and
# "a gate that blocked with nowhere to route the escalation would just teach people to
# bypass it." That was correct. usp_land_system_change, sandbox.system_change and the
# invalidation sweep all exist now, and the exemption was simply never revisited — which is
# CLAUDE.md checklist item 19 exactly: a provisional exemption applied for a sound reason,
# left open across sessions, becoming permanent by default.
#
# What it checks is a `System-Change: SC-nn` trailer, not a database lookup — CI holds no
# credential, and it gives an author a route rather than a wall. A replay of this same
# classifier over all 107 commits since it landed found ONE system-scope commit, so this
# gate is not about to start firing constantly; the 22 that predate it were invisible to CI
# and are a separate, retrospective debt.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Scope is a question about a RANGE, so the range has to be fetchable. The
          # default shallow clone has no merge base to diff against.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Classify the change
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          # A first push to a branch, or an initial commit, has no usable base. Fall back
          # to the previous commit rather than failing the job: a scope report that errors
          # is indistinguishable from one that found nothing.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="HEAD~1"
          fi

          # Exported, not just echoed: the blocking step below has to diff the SAME range
          # this one classified, or it would answer a different question than the one that
          # triggered it.
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "base=$BASE"
          set +e
          node scripts/detect-scope.mjs --base "$BASE" | tee scope.txt
          CODE=$?
          set -e

          # 10 is the script's deliberate "system-wide" code, distinct from 1 so a real
          # crash cannot be mistaken for a detection.
          if [ "$CODE" = "10" ]; then
            echo "scope=system" >> "$GITHUB_OUTPUT"
          elif [ "$CODE" = "0" ]; then
            echo "scope=component" >> "$GITHUB_OUTPUT"
          else
            echo "scope detection failed with exit $CODE"
            exit "$CODE"
          fi

      - name: Summarise
        run: |
          {
            echo "## Scope: \`${{ steps.scope.outputs.scope }}\`"
            echo
            echo '```'
            cat scope.txt
            echo '```'
            if [ "${{ steps.scope.outputs.scope }}" = "system" ]; then
              echo
              echo "This change reaches beyond the component being worked on. Per SANDBOX-SPEC §5.7 it"
              echo "needs a \`system_change\` record, and the next step FAILS without a"
              echo "\`System-Change: SC-nn\` trailer on a commit in this range."
              echo
              echo "No record yet? File one — \`sandbox_propose_system_change\` over MCP — pass the"
              echo "affected paths above verbatim, then assess it. Landing it marks the evidence under"
              echo "those paths stale, which is the point: everything already verified there needs"
              echo "re-checking."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: A system-wide change must name a system change
        # Deliberately AFTER the summary step, so a blocked author reads the classification,
        # the affected paths and the reason before they read the failure. A gate that fails
        # first and explains nowhere is the kind people learn to route around.
        if: steps.scope.outputs.scope == 'system'
        run: node scripts/detect-scope.mjs --base "${{ steps.scope.outputs.base }}" --require-record

      - name: The rule itself still classifies correctly
        # Run AFTER the report rather than before: if the rule has regressed, the report
        # above is what shows you how it now behaves, which is more useful than a bare
        # failure with no context.
        run: node scripts/check-scope-detection.mjs
